# Lifted from `legacy/scenes/strata.gd` (D0189, Slice 0). Legacy keyed bands by ROW at its own 32px
# logic cell with SURFACE_ROW=20; this file keys them by METRES BELOW SURFACE, which is scale-free --
# one metre is one logic tile on BOTH sides (legacy 32px/m, current 16px/m), so the ladder transfers
# unchanged while the pixel size does not. Legacy row -> metres: row - 20.
#
# row 86 == SEAL_TOP + SEAL_ROWS (84 + 2). The last band: everything below
# belongs to it, which matters because this world runs to 256m where legacy's ladder stopped at 66m.

