# The shallow, first ore -- matches docs/ARCHITECTURE.md §6's scenario-format example (material:
# ore_copper) exactly, so the first real scenario and the first real ore share a name.
id: ore_copper
layer: topsoil_shale
kind: ore
hardness: 2.0
display_name: Copper ore

# --- appearance (Slice 0) ---------------------------------------------------------------
# Appearance lifted from `legacy/src/data/materials/ore.tres` via `legacy/src/data/material_def.gd`'s
# schema (D0189, Slice 0). Colors are [r, g, b] 0..1, verbatim from the .tres -- no conversion,
# no retuning. `.tres` is a binary-ish resource format; gate 22 requires data/ be human-diffable
# text, so the values move but the format does not.
#
# Legacy `ore` -- its GENERIC ore-in-rock record, lifted unaltered at the port because retinting then
# would have hidden new art inside a migration. The port is done and the material is named copper, so
# T001 is now TAKEN provisionally (D0610): `nugget_color` moves from legacy's silvery-white to a warm
# copper fleck, which also maximises the iron/copper contrast a player uses to tell the two ores apart
# (ore_iron's mark is cool blue-white). `base_color` stays legacy's neutral grey host -- the nugget is
# the mark; the country rock does not need to blush. Revert the one line to reverse.

base_color: [0.29, 0.3, 0.34]
grain: true
grammar: clastic
depth_darken: 0.25
glitters: true
nugget_color: [0.80, 0.47, 0.24]
nugget_count: 6
