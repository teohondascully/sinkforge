fields:
  id: {required: true, type: str}
  layer: {required: true, type: str}
  kind: {required: true, type: str}
  hardness: {required: true, type: float}
  display_name: {required: false, type: str}

  # Appearance, lifted from legacy/src/data/material_def.gd (D0189). Every field is OPTIONAL: a material
  # with no appearance block still validates and falls back in tests/body/material_look.gd (Slice 0; moves to view/ at Slice 3), so adding a
  # material never requires an art pass first.
  base_color: {required: false, type: list}
  grain: {required: false, type: bool}
  grammar: {required: false, type: str}
  cap_color: {required: false, type: list}
  nugget_color: {required: false, type: list}
  nugget_count: {required: false, type: int}
  depth_darken: {required: false, type: float}
  glitters: {required: false, type: bool}

  # NOT PERMITTED, and this comment is the record of why (docs/LEGACY_MIGRATION_MAP_2026-08-29.md 8):
  # craft_cost / craft_count re-import the one-time-purchase economy as DATA. The director's ruling is
  # that the terminal economy stays dead "not as code, not as a craft_cost data field, not as a save-
  # schema field." The validator does not currently reject unknown fields, so this is documentation, not
  # enforcement -- closing it at the gate is Slice 5's job, before any machine record is converted.
