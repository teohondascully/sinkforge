# Fuel, found shallow per docs/GDD.md §10 ("they need both fuel and ore"). Spans topsoil into
# Stonereach rather than being confined to one layer.
id: coal
layer: topsoil_shale
kind: fuel
hardness: 1.5
display_name: Coal

# --- appearance (Slice 0) ---------------------------------------------------------------
# Appearance lifted from `legacy/src/data/materials/coal.tres` via `legacy/src/data/material_def.gd`'s
# schema (D0189, Slice 0). Colors are [r, g, b] 0..1, verbatim from the .tres -- no conversion,
# no retuning. `.tres` is a binary-ish resource format; gate 22 requires data/ be human-diffable
# text, so the values move but the format does not.
#
# Legacy `coal`, lifted verbatim -- the one id present under the same name on both sides.
# `glitters: false` is load-bearing and legacy states why: "glittering coal was being mistaken for a
# blue crystal" (material_def.gd:34-35). Do not turn it on to make fuel easier to spot. STILL FALSE.
#
# TWO VALUES ARE NO LONGER LEGACY'S, AND BOTH ARE MEASUREMENTS (D0494). Four of the six strangers in
# `docs/playtests/2026-09-07_strangers76-81_seam_slot.md` never held coal; three hunted "black" and
# pressed holes. Legacy never had to tell coal from an open hole at THIS grid, and here it cannot:
#
#   * `base_color` was [0.15, 0.16, 0.19]. Its matrix sat **0.0191** from `BackdropPainter.COLOR_BG`,
#     the colour of dug space -- against 0.0943 for deepstone, the next-darkest rock, and 0.2180 for
#     the clay beside the seam. Coal was five times closer to a hole than any other rock, so a solid
#     metre and an open one were the same ink. Lifted to an anthracite grey-blue whose matrix clears
#     the next-darkest rock's own distance from dug space; coal is still the darkest thing in the
#     topsoil, well under clay.
#   * `nugget_count` was legacy's 7, which at `MaterialLook.LEGACY_CELL_SUBCELLS` is a facet on 10.9%
#     of cells -- 1.74 marks a metre, and **16.0% of coal metres carried NO facet at all**. The
#     tutorial seam is one of them: zero marks in its sixteen cells, a dead flat fill. 17 is the
#     smallest count that puts that under one metre in a hundred (16 -> 1.155%, 17 -> 0.828%).
#   * `nugget_color` was legacy's [0.34, 0.37, 0.44] and moves because the LIFT ABOVE ATE IT. A facet
#     is only a facet while it separates from the rock it sits in, and `tests/test_wall_lode.gd` gates
#     exactly that at 0.25: the lifted matrix put coal's mark at **0.243** in the wall plane, the one
#     material of seven to fail it. Scaled away from the new matrix along the same axis legacy chose,
#     back to 0.290. It is a brighter grey-blue, not a glitter -- `glitters` is still false, so no
#     glint flare, and at luma 0.40 it is nowhere near ore_iron's 0.66-0.95 mark.

base_color: [0.21, 0.22, 0.26]
grain: true
grammar: clastic
depth_darken: 0.22
glitters: false
nugget_color: [0.37, 0.40, 0.48]
nugget_count: 17
