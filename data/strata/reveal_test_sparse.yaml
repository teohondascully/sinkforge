# Reveal-layer density-sweep site, low end (docs/GDD.md §12, claims/C004). Every field except `id` and
# `reveal` is copied verbatim from `shallow_clay.yaml` -- this is a test-only variant, not a second real
# site, and keeping everything else identical isolates density as the one thing under test.
#
# A density sweep compares different generations, never the same generation at a different density:
# `sim/terrain_gen/shaft_generator.gd`'s own docstring states this explicitly. This file and
# `reveal_test_dense.yaml` are two distinct sites for exactly that reason, not one site with a
# runtime-adjustable knob.

id: reveal_test_sparse
width_cells: 48
max_depth_m: 256

layer_thresholds_m:
  topsoil_shale_end: 40
  stonereach_end: 140

cave:
  frequency: 0.11
  threshold_top: 0.47
  threshold_deep: 0.31
  min_depth_cells: 6
  x_stretch: 2.1

strata_shelf:
  band_height_cells: 4
  shelf_every: 3
  shelf_resist: 0.34

ore:
  material: ore_copper
  attempts_per_col: 1.0
  chance_deep: 0.85
  shallow_floor: 0.34
  size_min: 8
  size_depth_bonus: 44
  pending_sim_economy:
    amount_base: 30
    amount_depth_bonus: 170
    rich_chance: 0.45
    rich_amount_mult: 1.5

coal:
  material: coal
  attempts_per_col: 0.8
  chance_deep: 0.95
  shallow_floor: 0.42
  size_min: 6
  size_depth_bonus: 30
  pending_sim_economy:
    amount_base: 30
    amount_depth_bonus: 170

iron:
  material: ore_iron
  attempts_per_col: 0.5
  size_min: 10
  size_depth_bonus: 30
  pending_sim_economy:
    amount: 220

ruin:
  count: 1
  min_depth_m: 100
  radius_cells: 4

reveal:
  # The variable under test. Sparse: roughly one glimmer pocket per topsoil generation at this width --
  # a real, occasional find, not a wall-to-wall feature. material/size_min are unread by
  # ShaftGenerator._scatter_reveal_material (same documentation-only convention ore/coal/iron already
  # use for their own `material` field) but kept for a reader comparing this file to the real scatter
  # configs above.
  material: glimmer
  attempts_per_col: 0.15
  size_min: 6
