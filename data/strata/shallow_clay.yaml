# The first site, matching docs/ARCHITECTURE.md §6's scenario-format example (world.site: shallow_clay).
# Every numeric value below is ported from legacy/src/core/layered_world_gen.gd and
# legacy/src/core/heightmap_world_gen.gd (their original names are in each comment) with the SAME
# ratios/behavior, retargeted from the old L1/L2/L3 progression-gated layers to docs/GDD.md §11's three
# rule-set layers. None are re-tuned; re-tuning is separate work once there is a game to feel it in.
#
# Layer thresholds, ore/coal/iron depth ranges, and cave carve depth are all data here specifically so a
# per-shaft modifier (docs/GDD.md §2 -- "floods fast", "hard rock starts early") can override any of them
# with a second file later, without touching sim/terrain_gen's code (docs/DECISIONS_LEDGER.md D0016).

id: shallow_clay
# 64 METRES WIDE, RULED BY THE DIRECTOR 2026-09-01 (`docs/NEEDS_DIRECTOR.md` P031). This said 48 cells
# -- 12 metres -- and called itself "a shaft, not an open world". The framing is what forced the change:
# legacy's ported zoom ladder (D0325) frames 40 m at its most zoomed-IN rung, and a 48-cell world is 192
# world px, so filling a 1280-px frame needs zoom 6.67 -- the shipped default of 6.0 ALREADY framed wider
# than the world existed, and the capture showed void bands at both screen edges. The framing could not
# be fixed by a framing change.
#
# 256 rather than legacy's own 512: two screens wide at the ported framing, enough for the framing to be
# right and for GDD 13's factory rungs to have a floor, while still reading as a shaft rather than as an
# open world. Costs ~4 s of generation against 7.9 for 512 -- a one-time boot cost, and D0326's bake
# makes play cost independent of world width.
width_cells: 256
max_depth_m: 256          # docs/ARCHITECTURE.md §9's stated depth budget

layer_thresholds_m:
  topsoil_shale_end: 40   # docs/GDD.md §11: soft, fast digging, fuel and first ore
  stonereach_end: 140     # docs/GDD.md §11: hard rock, richer ore. Deep Works is stonereach_end..max_depth_m.

cave:
  # legacy CAVE_FREQ / CAVE_THRESHOLD_TOP / CAVE_THRESHOLD_DEEP / CAVE_MIN_DEPTH / CAVE_XSTRETCH
  frequency: 0.0656
  threshold_top: 0.47
  threshold_deep: 0.31
  min_depth_cells: 24
  x_stretch: 2.1
  # The ramp from threshold_top to threshold_deep reaches deep here rather than at the world's bottom
  # (D0402, the director's T016 ruling on V12): legacy ran it over 128 m; over 256 m the same ramp held
  # Stonereach at 8% air. Deep is reached at the Deep Works threshold and holds below it.
  deep_at_m: 140

strata_shelf:
  # legacy STRATA_BAND_H / STRATA_SHELF_EVERY / STRATA_SHELF_RESIST -- see that file's comment for why
  # SHELF_EVERY must not drop to 2 (a real regression, held by a legacy test this port does not carry
  # forward yet; tracked as a gap, not silently dropped -- docs/DECISIONS_LEDGER.md D0017)
  band_height_cells: 16
  shelf_every: 3
  shelf_resist: 0.34

ore:
  # legacy ORE_ATTEMPTS_PER_COL / ORE_CHANCE_DEEP / ORE_SHALLOW_FLOOR / ORE_SIZE_MIN / ORE_SIZE_DEPTH_BONUS
  material: ore_copper
  attempts_per_col: 0.25
  chance_deep: 0.85
  shallow_floor: 0.34
  size_min: 128
  size_depth_bonus: 704
  pending_sim_economy:
    # legacy ORE_AMOUNT_BASE / ORE_AMOUNT_DEPTH_BONUS / RICH_CHANCE / RICH_AMOUNT_MULT. NOT read by
    # sim/terrain_gen/shaft_generator.gd -- richness/deposit accounting is sim/economy or sim/items
    # territory, neither of which exists yet (docs/DECISIONS_LEDGER.md D0025). Nested here, not left
    # flat alongside the consumed fields above, specifically so "unconsumed" is a structural fact a
    # reader can see, not a claim living only in this comment. Whichever module lands first should
    # read these and promote them back to ore's top level.
    amount_base: 30
    amount_depth_bonus: 170
    rich_chance: 0.45
    rich_amount_mult: 1.5

coal:
  # legacy COAL_ATTEMPTS_PER_COL / COAL_CHANCE_DEEP / COAL_SHALLOW_FLOOR / COAL_SIZE_MIN / COAL_SIZE_DEPTH_BONUS
  material: coal
  attempts_per_col: 0.2
  chance_deep: 0.95
  shallow_floor: 0.42
  size_min: 96
  size_depth_bonus: 480
  pending_sim_economy:
    # legacy COAL_AMOUNT_BASE / COAL_AMOUNT_DEPTH_BONUS. Same gap and same reasoning as ore's above.
    amount_base: 30
    amount_depth_bonus: 170

iron:
  # legacy IRON_ATTEMPTS_PER_COL / IRON_SIZE_MIN / IRON_SIZE_DEPTH_BONUS. Legacy gated iron below a
  # research-progression "seal" (SEAL_TOP); that gate is dead pre-pivot design, so this port gates iron
  # by depth threshold (stonereach_end) alone.
  material: ore_iron
  attempts_per_col: 0.125
  size_min: 160
  size_depth_bonus: 480
  pending_sim_economy:
    # legacy IRON_AMOUNT. Same gap and same reasoning as ore's above.
    amount: 220

ruin:
  # New concept (docs/GDD.md §5, "artifacts found in deep ruins") -- no legacy analog ported (the old
  # _stamp_bazaar_ruin was tied to the dead Bazaar mechanic). One guaranteed chamber per shaft, no
  # earlier than min_depth_m, marked but empty: what a ruin actually contains is sim/items territory,
  # not yet built. docs/DECISIONS_LEDGER.md D0018.
  count: 1
  min_depth_m: 100
  radius_cells: 4

# --- A' step 8: legacy's content, each record its own config-gated pass (D0382-D0387), switched on
# together here (D0388). Values are legacy/src/core/layered_world_gen.gd's and heightmap_world_gen.gd's
# in their own units (metres, radians, per-metre rates); each pass converts by the cells a metre.
spawn_col_m: 32    # the tutorial start's spawn_col_m: the pad, the keepouts and the richness ramp measure from it

relief:
  # heightmap_world_gen.gd: BASE_PAD -9/+10 about SPAWN_COL, RELIEF_RAMP 16, the NEAR wave and the two FAR
  # waves, SURFACE_ROW_MIN/MAX. Two of the three SCARP_COLS at half legacy's distances (this world is half
  # as wide); the third fell beyond the edge.
  pad_centre_m: 32
  # The pad and its ramp, halved (D0402, T016/V10): legacy's -9/+10 pad on a 128 m world was a seventh of
  # it; the same pad here was a 24 m ruler-flat third. The tutorial start's fixtures reach -3..+7 m of the
  # spawn, so a half-width of 8 keeps every one on level ground and the hills arrive 8 m past the edge.
  pad_half_m: 8
  ramp_m: 8
  waves:
    - {amp_m: 0.85, freq_rad_per_m: 0.21, phase_rad: 0.5, ramp: near}
    - {amp_m: 1.60, freq_rad_per_m: 0.30, phase_rad: 0.0, ramp: far}
    - {amp_m: 0.90, freq_rad_per_m: 0.11, phase_rad: 1.7, ramp: far}
  scarps:
    - {at_m: 10, step_m: 5}
    - {at_m: 52, step_m: 4}
  scarp_span_m: 2
  max_rise_m: 9
  max_fall_m: 11

vertical:
  rift:      # RIFT_PER_COL .. RIFT_WALL_ORE_CHANCE; the width sine's pinch in radians a metre-row
    per_col: 0.018
    min_len_m: 34
    max_len_m: 80
    half_w_min_m: 0.8
    half_w_max_m: 2.1
    wander: 0.34
    wander_nudge: 0.10
    spawn_keepout_m: 10
    top_min_m: 2
    top_max_m: 10
    pinch_min: 0.16
    pinch_max: 0.30
    wall_ore_chance: 0.11     # a metre of wall; each turn grows a nugget of wall_ore_size_m2 (D0388)
    wall_ore_size_m2: 1
  sinkhole:  # SINKHOLE_COUNT .. SINKHOLE_MIN_DROP; the flare pow(x, 2.2) is VerticalPasses.FLARE_MILLI
    count: 3
    mouth_half_m: 3.0
    throat_half_m: 1.1
    keepout_m: 12             # legacy 20 on a world twice this wide left 37% of it eligible and no mouth at the boot seed (D0388)
    spacing_m: 15
    wander: 0.22
    wander_nudge: 0.08
    min_drop_m: 14

studding:
  ledge: {per_col: 0.22, len_min_m: 2, len_max_m: 4, headroom_m: 2, thickness_m: 1}
  spire: {chance: 0.075, floor_bias: 0.34, hang_min_m: 2, hang_max_m: 5, rise_min_m: 1, rise_max_m: 2}
  rubble: {chance: 0.060, size_m: 1}
  drought: {limit_m: 18, vug_chance: 0.28, vein_size_m2: 5, coal_bias: 0.38, back_min_m: 3, back_max_m: 14}

aquifer:
  # AQUIFER_PER_COL, AQUIFER_MIN_ROW = DEEPSLATE_ROW + 2 (two metres into the deep rock: stonereach_end + 2
  # here), AQUIFER_RX/RY, AQUIFER_ORE_SIZE
  per_col: 0.045
  # Aquifers from mid-Stonereach (D0402, T016/V11), where docs/GDD.md §11 puts them: "Flooding is a real
  # threat". Legacy's DEEPSLATE_ROW + 2 put them two metres into its deep rock; here that was 142 m and no
  # water existed above 140 m in a 256 m world.
  min_depth_m: 48
  rx_min_m: 2
  rx_max_m: 4
  ry_min_m: 2
  ry_max_m: 3
  ore_size_min_m2: 5
  ore_size_max_m2: 9

lode:
  # LODE_ATTEMPTS_PER_COL, LODE_SIZE_MIN/DEPTH_BONUS, LODE_AMOUNT_BASE/DEPTH_BONUS (per metre-cell; the pass
  # divides by the sixteen cells of a metre square, D0353's rule), LODE_MIN_DEPTH
  per_col: 0.35
  size_min_m2: 6
  size_depth_bonus_m2: 12
  amount_base: 40
  amount_depth_bonus: 170
  min_depth_m: 14

richness:
  # HORIZONTAL_STRENGTH, HORIZONTAL_FREQ, FRONTIER_BIAS
  strength: 0.55
  freq_per_m: 0.045
  frontier_bias: 0.5

tree:
  # TREE_CHANCE, TREE_GAP, trunk 2..3; the widths are this build's (legacy's trunk was a metre-cell wide and
  # its canopy six cells in a T)
  chance: 0.20
  gap_m: 3
  trunk_min_m: 2
  trunk_max_m: 3
  trunk_w_m: 0.5
  canopy_w_m: 3.0
  canopy_h_m: 2.5
  keepout_m: 12
