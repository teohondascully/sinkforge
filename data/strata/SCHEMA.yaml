fields:
  id: {required: true, type: str}
  width_cells: {required: true, type: int}
  max_depth_m: {required: true, type: float}
  layer_thresholds_m: {required: true, type: dict}
  cave: {required: true, type: dict}
  strata_shelf: {required: true, type: dict}
  ore: {required: true, type: dict}
  coal: {required: true, type: dict}
  iron: {required: true, type: dict}
  ruin: {required: true, type: dict}
  reveal: {required: false, type: dict}
  # Legacy's surface (heightmap_world_gen.gd ground_row/terrace): a flat pad about the start's spawn
  # column, waves and scarps beyond it. Absent reads flat at the datum (A' step 8b, D0382).
  relief: {required: false, type: dict}
  # The start's spawn column, which the relief pad, the rift keepout and the sinkhole keepout measure
  # from (legacy SPAWN_COL). Absent reads the middle of the width.
  spawn_col_m: {required: false, type: int}
  # Legacy's vertical structure (layered_world_gen.gd _carve_rifts, _mineralize, the sinkhole passes):
  # `rift` and `sinkhole` sub-records in legacy's units. Absent carves none (A' step 8c, D0383).
  vertical: {required: false, type: dict}
  # Legacy's studding (_stud_ledges, _stud_spires, _scatter_rubble) and drought (_seed_droughts) passes:
  # `ledge`, `spire`, `rubble`, `drought` sub-records in legacy's units. Absent studs none (A' 8d, D0384).
  studding: {required: false, type: dict}
  # Legacy's aquifers (_seed_aquifers, _seed_aquifer_treasure): flooded pockets on the water plane with
  # a vein off the rim; `min_depth_m` below the datum. Absent floods none (A' 8e, D0385).
  aquifer: {required: false, type: dict}
  # Legacy's lodes (_seed_lodes, _grow_lode): ore behind the wall on the deposit plane, per-cell amounts
  # as legacy's per-metre stock over the cells of a metre square (D0353). Absent seeds none (A' 8e, D0385).
  lode: {required: false, type: dict}
  # Legacy's per-column richness field (_horizontal_field): `strength`, `freq_per_m`, `frontier_bias`.
  # Pulls the ore and coal scatters and the lodes' amounts. Absent reads one everywhere (A' 8f, D0386).
  richness: {required: false, type: dict}
