# Legacy's tutorial opening (legacy/scenes/world_seeder.gd, MainView's layout constants at main.gd
# 577-639), as a record. Columns are legacy's minus SPAWN_COL 49; rows are legacy's minus SURFACE.
# Per-metre stocks become per-cell: 200 -> 13 (208 a metre), 45 -> 3 (48), 120 -> 8 (128), 400 -> 25 (400).
id: tutorial
site: shallow_clay
spawn_col_m: 32
fixtures:
  # The surface ore vein beside spawn (STARTER_VEIN_CELL 47 and 48): the bootstrap ore you hand-mine.
  - {kind: solid, dx: -2, dy: 0, material: ore_iron, deposit: 13}
  - {kind: solid, dx: -1, dy: 0, material: ore_iron, deposit: 13}
  # The guaranteed surface coal (TUTORIAL_COAL_CELLS 54): the drill's fuel.
  - {kind: solid, dx: 5, dy: 0, material: coal, deposit: 13}
  # The starter adit (ADIT_COLS 52, 53; chamber 54; ADIT_ROOF 1): a stepped cut, each column two rows
  # tall and opening a row deeper than the last, so the body walks through at whatever height it arrives.
  - {kind: open, cells: [[3, 1], [3, 2], [4, 1], [4, 2], [4, 3], [5, 2], [5, 3], [5, 4]]}
  # The face: ore in the wall of the cells you stand in, at the back and bottom (ADIT_FACE_AMOUNT 45).
  - {kind: lode, dx: 4, dy: 3, material: ore_iron, amount: 3}
  - {kind: lode, dx: 5, dy: 2, material: ore_iron, amount: 3}
  - {kind: lode, dx: 5, dy: 3, material: ore_iron, amount: 3}
  - {kind: lode, dx: 5, dy: 4, material: ore_iron, amount: 3}
  # THE CREW'S DRILL (D0409): legacy sold the drill at the Bazaar, which this game refuses (D0346); the
  # GDD's answer for the forge -- found in the world, cold and ancient -- is the answer for the drill too.
  # It lies on the adit floor where the face is, a pile the player walks over, then places in the shaft.
  - {kind: pile, item: drill, count: 1, dx: 4, dy: 3}
  # The same vein continues behind rock, straight down off the bottom of the face (ADIT_DEEP_AMOUNT 120).
  - {kind: lode, dx: 5, dy: 5, material: ore_iron, amount: 8}
  - {kind: lode, dx: 5, dy: 6, material: ore_iron, amount: 8}
  - {kind: lode, dx: 5, dy: 7, material: ore_iron, amount: 8}
  # THE GUARANTEED TUTORIAL TREE (legacy world_seeder.gd:90-99, TUTORIAL_TREE_COL 51; D0425): "the wood
  # source the bazaar step needs, since depth-banded worldgen plants trees out past the ruin, unreachable
  # on the surface early." The same is true here -- the site keeps trees 12 m off the spawn and the seed's
  # nearest stands 22 m away, across the shaft strangers 3 and 4 fell into looking for one. Legacy's
  # trunk was two metres with a crown of three leaf metres; here the world's own tree pass plants it, so
  # it is the shape of every other tree (a metre-block tree read as a crate). Legacy stood it at +2
  # between spawn and the shaft because its trees were walk-through; this world's are solid, so it stands
  # at -6, on the pad past the forge pocket, off the adit's path and on the side away from the shaft.
  - {kind: tree, dx: -6, trunk_m: 2}
  # THE CHIMNEY'S CAP (T031 taken provisionally, D0434). The site's first sinkhole mouth stands at +14 m --
  # a one-metre chimney 45 m deep, two metres past the pad, put there by the keepout clamp
  # (vertical_passes.gd) -- and six of eight strangers walked into it before the third rung. Two metres of
  # clay over its mouth: the descent is a dig, not a blind fall, and the world beneath is untouched. Off
  # the pad by design (`off_pad` exempts it from the pad-width pin). Delete these two lines to reverse.
  - {kind: solid, dx: 14, dy: 0, material: clay, off_pad: true}
  - {kind: solid, dx: 14, dy: 1, material: clay, off_pad: true}
  # The bootstrap forge pocket (MINESHAFT_FORGE_CELL 46): a shallow one-deep well off the drill shaft.
  - {kind: open, cells: [[-3, 0], [-3, 1]]}
  - {kind: solid, dx: -3, dy: 2, material: clay, deposit: 0}
  - {kind: machine, id: processor, dx: -3, dy: 0}
  # The drill shaft (MINESHAFT_COL 56): an open mouth and drill cell so tossed coal drops onto the drill,
  # a rich solid vein below it to bore (MINESHAFT_ORE_RICHNESS 400), the auto forge under that, a gap
  # for ingots, a floor.
  - {kind: open, cells: [[7, 0], [7, 1]]}
  - {kind: solid, dx: 7, dy: 2, material: ore_iron, deposit: 25}
  - {kind: open, cells: [[7, 3], [7, 4]]}
  - {kind: solid, dx: 7, dy: 5, material: clay, deposit: 0}
  - {kind: machine, id: processor, dx: 7, dy: 3}
  # THE CREW'S CACHE (D0409): the ladder's later rungs ask for a hopper, a generator and a winch pair that
  # nothing supplied. They lie in a floored pocket under the spawn, three metres below the adit's floor --
  # inside the pad, out of the scoop's reach from the adit, found by digging on.
  - {kind: room, dx: 1, dy: 7, w: 3, h: 1, floor: clay}
  - {kind: pile, item: hopper, count: 1, dx: 1, dy: 7}
  - {kind: pile, item: generator, count: 1, dx: 2, dy: 7}
  - {kind: pile, item: winch_head, count: 1, dx: 3, dy: 7}
  - {kind: pile, item: winch_station, count: 1, dx: 3, dy: 7}
