# Publishes a harness run's result table AND decides whether the run was a result at all.
#
# A composite action rather than the same forty lines pasted into both jobs: the two jobs must judge a run
# by identical rules, and two copies of a rule are the thing this repository keeps finding stale. The
# display job's layer selection was a hand-kept list that went out of date and left two layers running in
# no job at all; that is the same shape one level up.
name: harness verdict
description: Publish the harness summary table and fail if the run was not a real result.

inputs:
  log-dir:
    description: Directory holding summary.txt and the per-layer logs.
    required: true
  label:
    description: Heading for the run summary, e.g. "harness — headless".
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/verdict.sh" "${{ inputs.log-dir }}" "${{ inputs.label }}"
