# CI, post-pivot.
#
# This file used to run the prior codebase's full 108-layer check suite against a live
# Godot build (two jobs: one headless, one under xvfb for the pixel-dependent layers —
# see git history for that version's header, which is worth reading for how carefully
# it earned each of its two jobs). That codebase now lives in legacy/, frozen and
# read-only, and docs/ARCHITECTURE.md excludes it from every lint and gate on purpose:
# a green check against code nobody is changing anymore is not evidence about anything.
# Running that suite here would violate the exclusion this file exists to enforce.
#
# What replaces it: the structural gates docs/QUALITY.md requires from the first
# commit of real code, built in docs/ONBOARDING.md Task 0 before there is any code
# for them to check. They are static analysis over the source tree — no Godot
# install, no display, no engine boot — because none of them need to run the game to
# answer their question (a layer-dependency violation, an oversized file, an
# unschema'd data file are all facts about the text of the repository).
#
# The `authorship` job's commit-trailer check ports forward unchanged: it is pure git
# hygiene with no game-code coupling (docs/DECISIONS.md's locked no-trailer rule),
# so it moved to the new tools/ rather than into legacy/tools/ with everything else.
# The capture-manifest check did not port — its subject (the active capture-generation
# workflow) isn't part of the new build yet, and reviving it is a separate decision.
#
# Added 2026-08-26 (D0047): the `tests` job below. Its absence was a real gap, not a
# deliberate scope decision like the two above — docs/QUALITY.md states "every gate is
# CI-enforced," but gates 8 (determinism), 9 (conservation), and 11 (movement acceptance)
# all depend on running `tests/test_*.gd` under the real engine, which this file never
# did. Every "all green" claim this project made was locally verified only; this job is
# what makes that claim true of CI itself, not just of whoever last ran the suite by hand.
name: harness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # D0060: the full 1000x1500 fuzz sweep (~114s measured) is too slow for every commit -- "a fuzzer
    # that takes four minutes will get disabled within a month" (the director's own words) -- but the
    # allowlisted residual (docs/DECISIONS_LEDGER.md D0060) needs SOME regular, real run to catch it
    # growing. Daily, not per-commit: `fuzz_nightly` below.
    - cron: "17 6 * * *"

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit must be authored by the repository owner and carry no co-author
  # trailer, per docs/DECISIONS.md. The tracked commit-msg hook covers the ordinary
  # path but is skipped by --no-verify, so the same check runs here where it cannot
  # be bypassed.
  authorship:
    name: authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 IS THE JOB. A depth-1 checkout makes a trailer scan over one
      # commit find nothing and print the identical green line a clean history prints —
      # tools/check_trailers.sh refuses to report a verdict on a shallow clone rather
      # than pass on one, so removing this line turns the job red instead of a formality.
      #
      # `ref` PINS THIS JOB TO THE PULL REQUEST'S OWN HEAD (D0231). On a `pull_request` event the
      # default checkout is the synthetic `refs/pull/N/merge` commit, which GitHub itself authors and
      # commits as `noreply@github.com`. check_trailers.sh reads `git log --all` and asserts one
      # committer identity across the repository, so that single borrowed commit failed the gate on
      # every PR the moment main became protected — "2 distinct found", neither of them wrong, one of
      # them not ours. The gate was right and its population was wrong: what it must read is the
      # commits that will land. `github.sha` keeps push builds behaving exactly as before.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check commit authorship
        run: bash tools/check_trailers.sh

      - name: .githooks/commit-msg mutation tests (D0151) — BLOCKING
        run: bash tools/test_commit_msg_hook.sh

  # docs/QUALITY.md gates 1-7, 13, 15-16, 22-23 — the structural gates docs/ONBOARDING.md
  # Task 0.6 requires before any real code, so a violation is caught the moment it's
  # introduced rather than discovered as an inherited mess later. Every script here
  # is self-contained Python, mutation-tested against a deliberately broken fixture
  # before being trusted (docs/QUALITY.md §2: "a check that has never been observed
  # failing is not a check").
  gates:
    name: structural gates (layer boundaries, size limits, LOC ratio, schema, claims)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, same reason as the authorship job above: check_loc_ratio.py (QUALITY gate 7)
      # reads a trailing window of commit history to measure instrument-vs-game LOC growth, not just
      # the totals on disk. A depth-1 checkout would make that history read empty on every run, which
      # the script itself detects and reports as ADVISORY rather than silently mismeasuring — but a
      # gate that can never actually gate in its own CI environment is the failure worth avoiding here.
      #
      # `ref` pinned to the PR's real head for the SAME reason the authorship job pins it (D0231), found
      # a second time in a second gate (D0235). Unpinned, a `pull_request` run checks out GitHub's
      # synthetic `refs/pull/N/merge` commit -- and that commit is COMMITTED AT THE MOMENT CI RUNS. So
      # `check_working_freshness.py`, which compares docs/WORKING.md's stated date against HEAD's commit
      # date, was reading a HEAD dated *now* instead of the commit under test: it failed a PR whose
      # WORKING.md was written the same evening, purely because the run crossed midnight UTC. Worse, it
      # means an OPEN PR goes red by the passage of time alone, with nobody having touched it.
      #
      # The trade this accepts: gates now read the PR's own head rather than the merge result, so a
      # violation introduced by the merge itself is caught by the `tests` job (still unpinned, and
      # correctly so) rather than here. Worth it -- with rebase-only merges the two differ only while a
      # PR is behind main, and two jobs silently testing different commits is its own defect.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator dependency
        run: pip install pyyaml

      - name: No test suite redeclares a tests/test_base.gd member (D0117/D0119) — --no-verify skips the local hook, not CI
        run: sh tools/check_base_namespace.sh

      # QUALITY gate 31 (D0201). Reconciles the tracked `tests/test_*.gd` population against the suite
      # list in the `tests` job below. Four suites written across Slices 0 and 1 were passing locally and
      # running nowhere; the counts on both sides looked healthy the whole time, which is why this
      # compares SETS and prints members.
      - name: Every tracked test suite is actually run by CI (QUALITY gate 31)
        run: python3 tools/layer_lint/check_suite_coverage.py

      - name: Layer dependency lint (ARCHITECTURE §3)
        run: python3 tools/layer_lint/layer_lint.py

      - name: No engine imports in core/ or sim/ (ARCHITECTURE §3-4)
        run: python3 tools/layer_lint/no_engine_imports.py

      - name: sim/world and sim/terrain_gen coordinates name their grid (D0020, D0027)
        run: python3 tools/layer_lint/check_coordinate_naming.py

      - name: File and function size limits (QUALITY gates 3-4)
        run: python3 tools/layer_lint/check_size_limits.py

      - name: Instrument LOC must not exceed game LOC (QUALITY gate 7)
        run: python3 tools/layer_lint/check_loc_ratio.py

      - name: Schema validation for data/ (QUALITY gate 13)
        run: python3 tools/schema_validator/schema_validator.py

      - name: Every scenario and harness layer names a claim (QUALITY gates 15-16)
        run: python3 tools/layer_lint/check_claim_references.py

      - name: Generated data/ records are fresh (QUALITY gate 22, ADR 0004)
        run: python3 tools/data_codegen/generate.py --check

      - name: docs/WORKING.md is not older than HEAD (QUALITY gate 23)
        run: python3 tools/layer_lint/check_working_freshness.py

      - name: docs/CORRECTIONS.md has not fallen behind the ledger's own correction links (QUALITY gate 30)
        run: python3 tools/check_corrections_freshness.py --check

      - name: project.godot keeps its load-bearing flags (DECISIONS.md "Enforcement tripwire #1")
        run: python3 tools/layer_lint/check_project_settings.py

      - name: No untracked file exists outside the shipped .gitignore (QUALITY gate 27, D0063)
        run: python3 tools/layer_lint/check_untracked_files.py

      # Phase 0a enforcement (D0149): the gate scripts above are themselves untested code the moment CI
      # stops running their own mutation-test files by hand. This runs every one of them -- whichever
      # scripts happen to exist under tools/test_*.py and tools/*/test_*.py, globbed fresh each run, never
      # a hand list that can go stale the way BRIEF.md's own prose did (D0143/D0146/D0148). A gate script
      # with no test file alongside it is simply not covered by this step; adding one is what brings it in.
      - name: Gate mutation tests (every tools/**/test_*.py, any depth) — BLOCKING
        run: |
          set -e
          count=0
          while IFS= read -r f; do
            echo "=== $f ==="
            python3 "$f"
            count=$((count + 1))
          done < <(find tools -name 'test_*.py' | sort)
          echo "Ran $count gate mutation test file(s)."

      # tools/quality_check/ (docs/DECISIONS_LEDGER.md D0096-D0099). Duplication is the one instrument
      # that gates -- BLOCKING per D0099, since 0 clusters is this project's verified-clean state and a
      # regression is a fact about the tree a build should refuse. The other three are `continue-on-
      # error: true` on purpose, not because they happen to always exit 0: each prints a real dashboard
      # (GDScript length against the still-enforced hard cap above; Python length/complexity against
      # frozen advisory guardrails, D0098; module coupling with stub directories excluded and named) and
      # none of them gates, by the director's own explicit instruction -- the flag makes that a property
      # of the CI config, not something that depends on the script continuing to behave itself.
      - name: Duplication across core/sim/interface/view/shell + harness/experiment/tools (D0099) — BLOCKING
        run: python3 tools/quality_check/duplication.py

      - name: Function-length distribution + Python advisory guardrail (D0096, D0098) — report only
        continue-on-error: true
        run: python3 tools/quality_check/function_length.py

      - name: Cyclomatic complexity distribution + Python advisory guardrail (D0096, D0098) — report only
        continue-on-error: true
        run: python3 tools/quality_check/complexity.py

      - name: Module coupling, sim/ and tools/, stub modules excluded (D0096, D0098) — report only
        continue-on-error: true
        run: python3 tools/quality_check/coupling.py

  # Runs every tests/test_*.gd suite under the real, pinned engine (QUALITY gates 8, 9, 11 —
  # determinism, conservation, movement acceptance — all depend on this actually happening).
  # Godot is downloaded and checksum-verified rather than pulled from a marketplace action,
  # so this job depends on nothing but GitHub's own release infrastructure and a number this
  # file states itself. Pinned to the exact version this project develops against locally
  # (`godot --version` => 4.6.2.stable.official) so a CI pass and a local pass mean the same
  # thing; bump both together, not CI alone, or the two silently diverge again.
  #
  # Each suite is its own step on purpose: a failure names the exact suite in the Actions UI
  # without needing to open a log and find the right line, and one suite hanging (the
  # documented core/MODULE.md hazard: an unguarded runtime error directly inside _initialize()
  # itself does not crash, it hangs with no exit code) times out that one step via timeout-minutes
  # rather than silently consuming the whole job's budget.
  #
  # Every suite below runs through tools/run_gd_test.sh, not a bare `./godot --script` — a SECOND,
  # different, and more dangerous failure mode than the hang above (docs/DECISIONS_LEDGER.md
  # D0115/D0116): a runtime error inside a CALLED function (every real _test_*() function, since
  # _initialize() is always just a flat list of calls to them) does NOT hang and does NOT set a
  # non-zero exit code — GDScript logs a SCRIPT ERROR and keeps going, so test_base.gd's own
  # "ALL PASS" can print, and the process can exit 0, over a suite that silently lost part of its
  # own coverage mid-run. The self-test step above proves the wrapper catches this before any
  # step below is allowed to rely on it.
  tests:
    name: godot test suites (determinism, conservation, movement acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.6.2-stable"
      GODOT_SHA512: "b6e4d5a716085e9649905be2afe77f723f97853544fb33392ce3d32594c730a95d9eb4d1042ed51508904c9e1d996bd36b7c7a2bf4f93f5b1885e98d81b792e7"
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify Godot ${{ env.GODOT_VERSION }} (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      # A fresh checkout has no .godot/ import cache. Without this, every class_name global
      # (Body, TileGrid, HostileChamber, ...) fails to resolve and every suite below fails to
      # parse, not to run — this exact gap has bitten this project before (docs memory: "a
      # fresh worktree is not a control").
      - name: Import project (populate .godot/ cache)
        run: ./godot --headless --path . --import

      # D0115/D0116: test_base.gd's own PASS/FAIL bookkeeping can print "ALL PASS" and exit 0 even
      # after a real mid-suite crash — GDScript has no try/catch, so a runtime error inside any
      # called function (every real _test_*() function) is invisible to _check()/_finish()'s own
      # counters. tools/run_gd_test.sh is the fix (reads raw output for a SCRIPT ERROR: line, on
      # top of the exit code); this step proves the fix against a real, reproducible crash BEFORE
      # any step below is allowed to trust it — the director's own bar: "until that test exists and
      # is observed failing on the pre-fix harness, the fix is not trusted."
      - name: tools/run_gd_test.sh self-test (D0115/D0116 — must run before every suite below trusts it)
        run: bash tools/test_run_gd_test.sh ./godot

      - name: test_fixed_point
        run: bash tools/run_gd_test.sh ./godot res://tests/test_fixed_point.gd

      - name: test_split_rng
        run: bash tools/run_gd_test.sh ./godot res://tests/test_split_rng.gd

      - name: test_entity_id_pool
        run: bash tools/run_gd_test.sh ./godot res://tests/test_entity_id_pool.gd

      - name: test_replay_determinism (hash-and-replay mechanism check, not QUALITY gate 8's own subject -- see test_shaft_replay_determinism below)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_replay_determinism.gd

      - name: test_tile_grid
        run: bash tools/run_gd_test.sh ./godot res://tests/test_tile_grid.gd

      - name: test_world_materials
        run: bash tools/run_gd_test.sh ./godot res://tests/test_world_materials.gd

      - name: test_value_noise
        run: bash tools/run_gd_test.sh ./godot res://tests/test_value_noise.gd

      - name: test_shaft_generator
        run: bash tools/run_gd_test.sh ./godot res://tests/test_shaft_generator.gd

      - name: test_heightfield
        run: bash tools/run_gd_test.sh ./godot res://tests/test_heightfield.gd

      - name: test_body
        run: bash tools/run_gd_test.sh ./godot res://tests/test_body.gd

      - name: test_hostile_chamber
        run: bash tools/run_gd_test.sh ./godot res://tests/test_hostile_chamber.gd

      - name: test_shaft_replay_determinism (QUALITY gate 8 — real ShaftGenerator+TileGrid+Body sim, two-process replay)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_shaft_replay_determinism.gd

      - name: test_cave_geometry
        run: bash tools/run_gd_test.sh ./godot res://tests/test_cave_geometry.gd

      - name: test_body_acceptance (QUALITY gate 11 — movement acceptance suite)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_body_acceptance.gd

      - name: test_bounds_invariant (QUALITY gate 24 — body never leaves the grid)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_bounds_invariant.gd

      - name: test_reachability_sweep (QUALITY gate 25 — full reachable extent, not just the scripted route)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reachability_sweep.gd

      - name: test_body_fuzz_fast (QUALITY gate 26 — goalless input fuzzer, fast per-commit subset)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_body_fuzz_fast.gd

      - name: test_body_fuzz_regression_d0122 (QUALITY gate 29 — D0122's nightly escape, now a per-commit case)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_body_fuzz_regression_d0122.gd

      - name: test_reveal_metric (claims/C004's own dig-rate-lift instrument, D0114)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reveal_metric.gd

      - name: test_reveal_replay_driver (claims/C004's own replay driver, D0129)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reveal_replay_driver.gd

      - name: test_floor_source_telemetry (grounding-path telemetry, D0132)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_floor_source_telemetry.gd

      # D0201. These four were written in Slices 0 and 1 and never wired in here, so every guard they
      # carry — the Slice 0 palette's colour-distance claim, the mining verb, the dig edge latch, and
      # D0192/D0199's own spawn-bounds controls — has been running nowhere. Found by reconciling the
      # `tests/test_*.gd` population against this file's own list rather than by reading either alone;
      # neither side looks wrong on its own, which is the whole shape of the failure.
      - name: test_material_palette (Slice 0's lifted palette and its colour-distance claim, D0189)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_material_palette.gd

      - name: test_mining (cursor-aim, reach, hold-to-charge, the bite, the hollow tell — D0195/D0196/D0200)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_mining.gd

      - name: test_mining_bite (one blow's volume against legacy's metre, D0200)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_mining_bite.gd

      - name: test_reveal_scene_dig_edge (dig is edge-triggered, Defect B — D0188)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reveal_scene_dig_edge.gd

      - name: test_step_up_grounding (a climb owns its tick; the on_floor/floor_source pair — D0205)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_step_up_grounding.gd

      - name: test_footprint_grounding (both grounding paths share one full-footprint criterion — D0206)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_footprint_grounding.gd

      - name: test_movement_course (the agility playground still poses what it claims — D0208)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_movement_course.gd

      - name: test_view_window (per-frame draw work is bounded by the viewport — D0211)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_view_window.gd

      - name: test_corner_consent (an instant translation needs the body already moving — D0213)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_corner_consent.gd

      - name: test_interface (L2 is a door — observe() is pure, an Observation is a copy, D0214)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_interface.gd

      - name: test_score (the lifted score — seamless loop, deterministic beds, depth-driven mix, D0215)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_score.gd

      - name: test_particles (the cosmetic layer is capped, retires, and cannot move the sim — D0216)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_particles.gd

      - name: test_reveal_spawn_bounds (the spawn never sits flush against a world edge — D0192/D0199)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reveal_spawn_bounds.gd
      - name: test_seams (rock grain, now in core/ so view can reach grain() — D0227/D0237)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_seams.gd

      - name: test_world_view (the coordinator skeleton — a painter gets its own canvas, D0240)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_world_view.gd

      - name: test_sky_painter (the first painter — the starfield is non-empty and does not lattice, D0244)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_sky_painter.gd

      - name: test_reveal_args (the scene's flags, parseable without launching a process — D0244)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_reveal_args.gd

      - name: test_empty_population_guard (the vacuous-assertion guard refuses a TRUE condition over 0 — D0245)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_empty_population_guard.gd
      - name: test_view_lifts (the sprite loader caches its misses; a light pass owns only its canvas)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_view_lifts.gd
      - name: test_settings (the split halves share one bindings map; persist=false writes nothing)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_settings.gd
      - name: test_recorded_sessions (every director recording is binding until retired — P002/D0228)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_recorded_sessions.gd

  # D0060: the deep companion to test_body_fuzz_fast above -- the full 1000-seed x 1500-tick sweep
  # (~114s measured), which is why it runs nightly rather than on every push/PR. Only fires on the
  # `schedule` trigger declared above; push/PR events skip this job entirely. Duplicates the Godot
  # setup steps from `tests` rather than sharing them across jobs -- GitHub Actions jobs don't share
  # filesystem state, and a `needs:` dependency here would make every push/PR wait on a job it never
  # actually runs.
  fuzz_nightly:
    name: fuzz nightly (full 1000x1500 sweep, allowlisted residual per D0060)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.6.2-stable"
      GODOT_SHA512: "b6e4d5a716085e9649905be2afe77f723f97853544fb33392ce3d32594c730a95d9eb4d1042ed51508904c9e1d996bd36b7c7a2bf4f93f5b1885e98d81b792e7"
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify Godot ${{ env.GODOT_VERSION }} (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Import project (populate .godot/ cache)
        run: ./godot --headless --path . --import

      - name: tools/run_gd_test.sh self-test (D0115/D0116 — must run before the suite below trusts it)
        run: bash tools/test_run_gd_test.sh ./godot

      - name: test_body_fuzz (full sweep, D0060 allowlist)
        run: bash tools/run_gd_test.sh ./godot res://tests/test_body_fuzz.gd
