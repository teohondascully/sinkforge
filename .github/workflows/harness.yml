# CI, post-pivot.
#
# This file used to run the prior codebase's full 108-layer check suite against a live
# Godot build (two jobs: one headless, one under xvfb for the pixel-dependent layers —
# see git history for that version's header, which is worth reading for how carefully
# it earned each of its two jobs). That codebase now lives in legacy/, frozen and
# read-only, and docs/ARCHITECTURE.md excludes it from every lint and gate on purpose:
# a green check against code nobody is changing anymore is not evidence about anything.
# Running that suite here would violate the exclusion this file exists to enforce.
#
# What replaces it: the structural gates docs/QUALITY.md requires from the first
# commit of real code, built in docs/ONBOARDING.md Task 0 before there is any code
# for them to check. They are static analysis over the source tree — no Godot
# install, no display, no engine boot — because none of them need to run the game to
# answer their question (a layer-dependency violation, an oversized file, an
# unschema'd data file are all facts about the text of the repository).
#
# The `authorship` job's commit-trailer check ports forward unchanged: it is pure git
# hygiene with no game-code coupling (docs/DECISIONS.md's locked no-trailer rule),
# so it moved to the new tools/ rather than into legacy/tools/ with everything else.
# The capture-manifest check did not port — its subject (the active capture-generation
# workflow) isn't part of the new build yet, and reviving it is a separate decision.
#
# Added 2026-08-26 (D0047): the `tests` job below. Its absence was a real gap, not a
# deliberate scope decision like the two above — docs/QUALITY.md states "every gate is
# CI-enforced," but gates 8 (determinism), 9 (conservation), and 11 (movement acceptance)
# all depend on running `tests/test_*.gd` under the real engine, which this file never
# did. Every "all green" claim this project made was locally verified only; this job is
# what makes that claim true of CI itself, not just of whoever last ran the suite by hand.
name: harness

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit must be authored by the repository owner and carry no co-author
  # trailer, per docs/DECISIONS.md. The tracked commit-msg hook covers the ordinary
  # path but is skipped by --no-verify, so the same check runs here where it cannot
  # be bypassed.
  authorship:
    name: authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 IS THE JOB. A depth-1 checkout makes a trailer scan over one
      # commit find nothing and print the identical green line a clean history prints —
      # tools/check_trailers.sh refuses to report a verdict on a shallow clone rather
      # than pass on one, so removing this line turns the job red instead of a formality.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit authorship
        run: bash tools/check_trailers.sh

  # docs/QUALITY.md gates 1-7, 13, 15-16, 22-23 — the structural gates docs/ONBOARDING.md
  # Task 0.6 requires before any real code, so a violation is caught the moment it's
  # introduced rather than discovered as an inherited mess later. Every script here
  # is self-contained Python, mutation-tested against a deliberately broken fixture
  # before being trusted (docs/QUALITY.md §2: "a check that has never been observed
  # failing is not a check").
  gates:
    name: structural gates (layer boundaries, size limits, LOC ratio, schema, claims)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, same reason as the authorship job above: check_loc_ratio.py (QUALITY gate 7)
      # reads a trailing window of commit history to measure instrument-vs-game LOC growth, not just
      # the totals on disk. A depth-1 checkout would make that history read empty on every run, which
      # the script itself detects and reports as ADVISORY rather than silently mismeasuring — but a
      # gate that can never actually gate in its own CI environment is the failure worth avoiding here.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator dependency
        run: pip install pyyaml

      - name: Layer dependency lint (ARCHITECTURE §3)
        run: python3 tools/layer_lint/layer_lint.py

      - name: No engine imports in core/ or sim/ (ARCHITECTURE §3-4)
        run: python3 tools/layer_lint/no_engine_imports.py

      - name: sim/world and sim/terrain_gen coordinates name their grid (D0020, D0027)
        run: python3 tools/layer_lint/check_coordinate_naming.py

      - name: File and function size limits (QUALITY gates 3-4)
        run: python3 tools/layer_lint/check_size_limits.py

      - name: Instrument LOC must not exceed game LOC (QUALITY gate 7)
        run: python3 tools/layer_lint/check_loc_ratio.py

      - name: Schema validation for data/ (QUALITY gate 13)
        run: python3 tools/schema_validator/schema_validator.py

      - name: Every scenario and harness layer names a claim (QUALITY gates 15-16)
        run: python3 tools/layer_lint/check_claim_references.py

      - name: Generated data/ records are fresh (QUALITY gate 22, ADR 0004)
        run: python3 tools/data_codegen/generate.py --check

      - name: docs/WORKING.md is not older than HEAD (QUALITY gate 23)
        run: python3 tools/layer_lint/check_working_freshness.py

      - name: project.godot keeps its load-bearing flags (DECISIONS.md "Enforcement tripwire #1")
        run: python3 tools/layer_lint/check_project_settings.py

  # Runs every tests/test_*.gd suite under the real, pinned engine (QUALITY gates 8, 9, 11 —
  # determinism, conservation, movement acceptance — all depend on this actually happening).
  # Godot is downloaded and checksum-verified rather than pulled from a marketplace action,
  # so this job depends on nothing but GitHub's own release infrastructure and a number this
  # file states itself. Pinned to the exact version this project develops against locally
  # (`godot --version` => 4.6.2.stable.official) so a CI pass and a local pass mean the same
  # thing; bump both together, not CI alone, or the two silently diverge again.
  #
  # Each suite is its own step on purpose: a failure names the exact suite in the Actions UI
  # without needing to open a log and find the right line, and one suite hanging (the
  # documented core/MODULE.md hazard: an unguarded runtime error in a bare --headless --script
  # run does not crash, it hangs with no exit code) times out that one step via timeout-minutes
  # rather than silently consuming the whole job's budget.
  tests:
    name: godot test suites (determinism, conservation, movement acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.6.2-stable"
      GODOT_SHA512: "b6e4d5a716085e9649905be2afe77f723f97853544fb33392ce3d32594c730a95d9eb4d1042ed51508904c9e1d996bd36b7c7a2bf4f93f5b1885e98d81b792e7"
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify Godot ${{ env.GODOT_VERSION }} (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      # A fresh checkout has no .godot/ import cache. Without this, every class_name global
      # (Body, TileGrid, HostileChamber, ...) fails to resolve and every suite below fails to
      # parse, not to run — this exact gap has bitten this project before (docs memory: "a
      # fresh worktree is not a control").
      - name: Import project (populate .godot/ cache)
        run: ./godot --headless --path . --import

      - name: test_fixed_point
        run: ./godot --headless --path . --script res://tests/test_fixed_point.gd

      - name: test_split_rng
        run: ./godot --headless --path . --script res://tests/test_split_rng.gd

      - name: test_entity_id_pool
        run: ./godot --headless --path . --script res://tests/test_entity_id_pool.gd

      - name: test_replay_determinism (QUALITY gate 8)
        run: ./godot --headless --path . --script res://tests/test_replay_determinism.gd

      - name: test_tile_grid
        run: ./godot --headless --path . --script res://tests/test_tile_grid.gd

      - name: test_world_materials
        run: ./godot --headless --path . --script res://tests/test_world_materials.gd

      - name: test_value_noise
        run: ./godot --headless --path . --script res://tests/test_value_noise.gd

      - name: test_shaft_generator
        run: ./godot --headless --path . --script res://tests/test_shaft_generator.gd

      - name: test_heightfield
        run: ./godot --headless --path . --script res://tests/test_heightfield.gd

      - name: test_body
        run: ./godot --headless --path . --script res://tests/test_body.gd

      - name: test_hostile_chamber
        run: ./godot --headless --path . --script res://tests/test_hostile_chamber.gd

      - name: test_cave_geometry
        run: ./godot --headless --path . --script res://tests/test_cave_geometry.gd

      - name: test_body_acceptance (QUALITY gate 11 — movement acceptance suite)
        run: ./godot --headless --path . --script res://tests/test_body_acceptance.gd
